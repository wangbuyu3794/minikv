name: M3 Formal Tests Linux Validation

on:
  push:
    branches:
      - validation/m3-tests-linux
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang
        build_type:
          - Debug
          - Release

    env:
      CC: ${{ matrix.compiler }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment info
        run: |
          set -euxo pipefail
          uname -a
          cmake --version
          "$CC" --version
          python3 --version
          echo "Build type: ${{ matrix.build_type }}"

      - name: Configure tests
        run: |
          set -euxo pipefail
          cmake -S . -B build/m3-formal-tests \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build tests
        run: |
          set -euxo pipefail
          cmake --build build/m3-formal-tests --parallel \
            2>&1 | tee "$RUNNER_TEMP/m3-build.log"

      - name: Verify compiler warnings
        run: |
          set -euxo pipefail
          python3 - "$RUNNER_TEMP/m3-build.log" <<'PY'
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(
              encoding="utf-8",
              errors="replace",
          ).splitlines()
          warnings = [line for line in lines if "warning:" in line.lower()]
          if warnings:
              print("project compiler warnings:", file=sys.stderr)
              for line in warnings:
                  print(line, file=sys.stderr)
              raise SystemExit(1)
          print("testing project compiler warnings: 0")
          PY

      - name: Verify registered tests
        run: |
          set -euxo pipefail
          ctest --test-dir build/m3-formal-tests \
            --show-only=json-v1 \
            > "$RUNNER_TEMP/m3-tests.json"

          python3 - "$RUNNER_TEMP/m3-tests.json" <<'PY'
          import json
          import sys

          expected = {
              "minikv.smoke",
              "minikv.server.help",
              "minikv.server.short-help",
              "minikv.resp2.parser",
              "minikv.resp2.encoder",
              "minikv.command",
              "minikv.server.linux",
              "minikv.server.integration",
          }
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              document = json.load(handle)
          tests = document.get("tests", [])
          names = [test.get("name") for test in tests]
          if len(names) != 8 or len(set(names)) != 8 or set(names) != expected:
              raise SystemExit(
                  f"unexpected CTest names: {sorted(names)!r}"
              )

          integration = next(
              test
              for test in tests
              if test.get("name") == "minikv.server.integration"
          )
          properties = {
              item.get("name"): item.get("value")
              for item in integration.get("properties", [])
          }
          if properties.get("TIMEOUT") != 60.0:
              raise SystemExit(
                  "integration TIMEOUT is not 60: "
                  f"{properties.get('TIMEOUT')!r}"
              )

          print("registered CTest names:", ", ".join(sorted(names)))
          print("registered CTest count: 8")
          print("integration TIMEOUT: 60")
          PY

      - name: Verify testing definitions
        run: |
          set -euxo pipefail
          python3 - build/m3-formal-tests/compile_commands.json <<'PY'
          import json
          import sys
          from pathlib import Path

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              entries = json.load(handle)

          required = {
              "src/server_linux.c": False,
              "tests/server_linux_test.c": False,
          }
          compiled = {
              "tests/resp2_encoder_test.c": False,
              "tests/command_test.c": False,
              "tests/server_integration_test.c": False,
          }

          for entry in entries:
              source = Path(entry["file"]).as_posix()
              command = entry.get("command")
              if command is None:
                  command = " ".join(entry["arguments"])
              for suffix in required:
                  if source.endswith(suffix):
                      if "MINIKV_SERVER_TESTING" not in command:
                          raise SystemExit(
                              f"{suffix} lacks MINIKV_SERVER_TESTING"
                          )
                      required[suffix] = True
              for suffix in compiled:
                  if source.endswith(suffix):
                      compiled[suffix] = True

          missing = [
              suffix
              for suffix, found in {**required, **compiled}.items()
              if not found
          ]
          if missing:
              raise SystemExit(f"missing compile commands: {missing!r}")

          print("testing definitions verified")
          print("new unit and extended server tests compiled")
          PY

      - name: Run all formal tests
        run: |
          set -euxo pipefail
          ctest --test-dir build/m3-formal-tests \
            --output-on-failure \
            --no-tests=error

      - name: Run unit tests directly
        run: |
          set -euxo pipefail
          ./build/m3-formal-tests/minikv_resp2_encoder_test
          ./build/m3-formal-tests/minikv_command_test

      - name: Run Linux tests verbosely
        run: |
          set -euxo pipefail
          ctest --test-dir build/m3-formal-tests \
            --verbose \
            --no-tests=error \
            -R '^(minikv\.server\.linux|minikv\.server\.integration)$'

      - name: Configure production
        run: |
          set -euxo pipefail
          cmake -S . -B build/m3-production \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DBUILD_TESTING=OFF \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build production
        run: |
          set -euxo pipefail
          cmake --build build/m3-production --parallel \
            2>&1 | tee "$RUNNER_TEMP/m3-production-build.log"

      - name: Verify production isolation
        run: |
          set -euxo pipefail
          ctest --test-dir build/m3-production \
            --show-only=json-v1 \
            > "$RUNNER_TEMP/m3-production-tests.json"

          python3 - \
            "$RUNNER_TEMP/m3-production-tests.json" \
            "$RUNNER_TEMP/m3-production-build.log" \
            build/m3-production/compile_commands.json <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          tests_path = Path(sys.argv[1])
          build_log_path = Path(sys.argv[2])
          commands_path = Path(sys.argv[3])
          build_root = Path("build/m3-production")

          document = json.loads(tests_path.read_text(encoding="utf-8"))
          tests = document.get("tests", [])
          if tests:
              raise SystemExit(
                  f"production unexpectedly registered tests: {tests!r}"
              )

          warnings = [
              line
              for line in build_log_path.read_text(
                  encoding="utf-8",
                  errors="replace",
              ).splitlines()
              if "warning:" in line.lower()
          ]
          if warnings:
              print("production project compiler warnings:", file=sys.stderr)
              for line in warnings:
                  print(line, file=sys.stderr)
              raise SystemExit(1)

          entries = json.loads(commands_path.read_text(encoding="utf-8"))
          runtime_commands = []
          for entry in entries:
              if Path(entry["file"]).as_posix().endswith(
                  "src/server_linux.c"
              ):
                  command = entry.get("command")
                  if command is None:
                      command = " ".join(entry["arguments"])
                  runtime_commands.append(command)

          if len(runtime_commands) != 1:
              raise SystemExit(
                  "expected one production server_linux.c command, got "
                  f"{len(runtime_commands)}"
              )
          if "MINIKV_SERVER_TESTING" in runtime_commands[0]:
              raise SystemExit(
                  "production runtime contains MINIKV_SERVER_TESTING"
              )

          forbidden = {
              "minikv_resp2_parser_test",
              "minikv_resp2_encoder_test",
              "minikv_command_test",
              "minikv_smoke",
              "minikv_server_linux_test",
              "minikv_server_integration_test",
          }
          generated = {
              path.name
              for path in build_root.rglob("*")
              if path.is_file()
          }
          unexpected = sorted(forbidden & generated)
          if unexpected:
              raise SystemExit(
                  f"production test executables exist: {unexpected!r}"
              )

          server = build_root / "minikv-server"
          if not server.is_file():
              raise SystemExit("production minikv-server is missing")

          link_text = (
              build_root
              / "CMakeFiles"
              / "minikv-server.dir"
              / "link.txt"
          ).read_text(encoding="utf-8")
          for library in ("libminikv_command.a", "libminikv_resp2.a"):
              if library not in link_text:
                  raise SystemExit(
                      f"production server link lacks {library}"
                  )

          runtime_library = build_root / "libminikv_server_runtime.a"
          symbols = subprocess.run(
              ["nm", "-g", "--defined-only", str(runtime_library)],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          if "minikv_server_test_" in symbols:
              raise SystemExit("production runtime exposes test hooks")

          app_source = Path("apps/minikv_server.c").read_text(
              encoding="utf-8"
          )
          if "minikv_server_test_" in app_source or "getenv(" in app_source:
              raise SystemExit("server CLI exposes a test hook")

          runtime_source = Path("src/server_linux.c").read_text(
              encoding="utf-8"
          )
          constant = (
              "#define MINIKV_DEFAULT_OUTPUT_LIMIT "
              "((size_t) 33554432U)"
          )
          if runtime_source.count(constant) != 1:
              raise SystemExit(
                  "production default output limit is not exactly 32 MiB"
              )

          print("production CTest count: 0")
          print("production project compiler warnings: 0")
          print("production runtime testing macro: absent")
          print("production test executables: absent")
          print("production test hooks: absent")
          print("production server RESP2/command links: present")
          print("production default output limit: 33554432")
          PY
